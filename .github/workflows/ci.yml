name: Devobs AI Intelligence CI

on:
  push:
    branches: [main, dev, feature/repair-bun-lockfile-consistency]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Bun lockfile tests, TypeScript and Vite build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'

      - name: Verify committed lockfile exists
        shell: bash
        run: |
          set -euo pipefail
          test -f bun.lock
          test -f package.json
          test ! -f package-lock.json || {
            echo 'Unexpected package-lock.json: review the package-manager contract' >&2
            exit 2
          }

      - name: Install dependencies from committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

      - name: TypeScript check
        run: bun run lint

      - name: Build Vite bundle
        run: bun run build
